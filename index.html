<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pinskin_행사참여</title>
<style>
  :root{
    --navy: #0b1c3f;
    --navy-deep: #060f24;
    --navy-mid: #16305e;
    --navy-soft: #2c4a86;
    --white: #ffffff;
    --off-white: #eef2fa;
    --shadow: rgba(6, 15, 36, 0.35);
  }
  *{ box-sizing: border-box; margin:0; padding:0; word-break: keep-all; }
  html,body{ height:100%; width:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; }
  body{
    font-family: 'Malgun Gothic','Segoe UI',system-ui,-apple-system,sans-serif;
    background: var(--navy-deep);
    color: var(--navy);
    overflow: hidden;
    position: relative;
  }

  /* ---------- floating background blobs ---------- */
  .bg-decor{ position: fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; overflow:hidden; z-index:0; pointer-events:none; }
  .blob{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 60%);
    filter: blur(2px);
    animation: floatY ease-in-out infinite;
  }
  .blob1{ width:260px; height:260px; top:8%; left:6%; animation-duration:9s; }
  .blob2{ width:180px; height:180px; top:60%; left:80%; animation-duration:11s; animation-delay:1s;}
  .blob3{ width:120px; height:120px; top:78%; left:12%; animation-duration:7.5s; animation-delay:.5s;}
  .blob4{ width:340px; height:340px; top:-8%; left:65%; animation-duration:13s; animation-delay:2s;}

  @keyframes floatY{
    0%,100%{ transform: translateY(0) translateX(0); }
    50%{ transform: translateY(-26px) translateX(10px); }
  }
  @keyframes floatSlow{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-16px) rotate(4deg); }
  }
  @keyframes popIn{
    from{ opacity:0; transform: translateY(24px) scale(.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* ---------- screen management ---------- */
  .screen{
    position: fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none;
    z-index:1;
  }
  .screen.active{
    opacity:1; visibility:visible; pointer-events:auto;
  }

  /* ================= HOME SCREEN ================= */
  #screen-home{
    background: var(--white);
    flex-direction:column;
    padding: 0;
  }
  .home-inner{
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding: 24px;
    overflow-y:auto;
    position:relative; z-index:2;
  }
  .home-header{
    display:flex; flex-direction:column; align-items:center; margin-bottom: 4px;
    margin-top:auto;
  }
  .home-header img{
    display:block; width:auto; height:30vh; min-height:150px; max-height:320px; max-width:70vw;
    object-fit:contain; opacity:1;
    margin: 0 auto 18px;
    animation: floatLogo 5s ease-in-out infinite;
  }
  @keyframes floatLogo{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }
  .home-header h1{
    color: var(--navy); font-size:30px; letter-spacing:1px; font-weight:900;
    text-align:center; word-wrap: break-word;
  }
  @media (max-width: 340px){ .home-header h1{ font-size:26px; } }
  @media (min-width: 480px){ .home-header h1{ font-size:44px; } }
  .home-tagline{
    color: var(--navy-soft);
    font-size: 15px;
    margin-top:10px;
    margin-bottom: 30px;
    letter-spacing:0.5px;
    font-weight:700;
    text-align:center;
  }

  .banner-grid{
    display:flex; flex-direction:column;
    width: 100%;
    max-width: 420px;
    margin: 0 auto auto;
  }
  .banner-grid .banner + .banner{ margin-top:20px; }

  .banner{
    position:relative;
    background: var(--white);
    border: 2.5px solid var(--navy);
    border-radius: 24px;
    padding: 30px 26px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    overflow:hidden;
    cursor:pointer;
    box-shadow: 0 16px 40px rgba(11,28,63,0.10);
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  @media (hover: hover){
    .banner:hover{
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 28px 60px rgba(11,28,63,0.20);
      border-color: var(--navy-deep);
    }
  }
  .banner.admin{
    background: var(--off-white);
  }
  .banner-badge{
    display:inline-block;
    font-size:11px; font-weight:800; letter-spacing:1.5px;
    color: var(--navy);
    background: var(--off-white);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .banner h2{
    font-size: 22px; color: var(--navy); font-weight:800; margin-bottom:8px;
  }
  .banner p{
    font-size: 13px; color:#5b6786; line-height:1.6;
  }
  @media (max-height: 800px){
    .home-inner{ padding: 16px 24px; }
    .home-header img{ height:24vh; min-height:130px; margin-bottom:10px; }
    .home-tagline{ margin-bottom:18px; }
    .banner{ padding: 18px 22px; }
    .banner-badge{ margin-bottom:8px; }
    .banner-grid .banner + .banner{ margin-top:12px; }
  }

  /* ================= DETAIL SCREENS ================= */
  .detail-screen{
    background: linear-gradient(180deg, var(--off-white) 0%, #ffffff 60%);
    flex-direction: column;
    align-items: stretch;
  }
  .detail-inner{
    width:100%; height:100%;
    overflow-y:auto;
    position:relative; z-index:2;
    padding: 30px 24px 60px;
  }
  .detail-topbar{
    max-width: 520px; margin: 0 auto 30px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .back-btn{
    display:flex; align-items:center;
    background: var(--navy);
    color:#fff; border:none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size:13px; font-weight:700;
    cursor:pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .back-btn svg{ margin-right:8px; }
  .back-btn:hover{ transform: translateX(-3px); background: var(--navy-mid); }
  .detail-topbar .mini-logo{
    width:auto; height:44px; object-fit:contain;
  }

  .detail-hero{
    max-width: 520px; margin: 0 auto 30px;
    text-align:center;
  }
  .detail-hero h2{
    font-size: 26px; font-weight:900; color: var(--navy); letter-spacing:0.5px;
  }
  .detail-hero p{
    margin-top:10px; color:#5b6786; font-size:13px; font-weight:600;
  }

  /* ---------- form ---------- */
  .form-card{
    max-width: 420px; margin: 0 auto;
    background:#fff;
    border: 1.5px solid #e6eaf4;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 26px rgba(11,28,63,0.06);
    animation: popIn .4s ease;
  }
  .form-group{ margin-bottom:18px; text-align:left; }
  .form-group label{
    display:block; font-size:13px; font-weight:800; color: var(--navy); margin-bottom:8px;
  }
  .form-group input{
    width:100%; padding: 13px 14px;
    border: 1.5px solid #d7deee; border-radius: 12px;
    font-size:16px; color: var(--navy);
    outline:none;
    transition: border-color .2s ease;
    font-family: inherit;
  }
  .form-group input:focus{ border-color: var(--navy-soft); }
  .submit-btn{
    width:100%; padding: 14px;
    background: var(--navy); color:#fff;
    border:none; border-radius: 999px;
    font-size:15px; font-weight:800;
    cursor:pointer;
    margin-top:6px;
    transition: background .2s ease, transform .2s ease;
  }
  .submit-btn:hover{ background: var(--navy-mid); transform: translateY(-2px); }
  .form-msg{
    text-align:center; font-size:13px; font-weight:700; margin-top:14px;
    min-height:18px;
  }
  .form-msg.ok{ color:#1a8a4d; }
  .form-msg.err{ color:#e63946; }
  .submit-btn:disabled{ opacity:.6; cursor:default; transform:none; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:0; right:0; bottom:32px; z-index:30;
    text-align:center; pointer-events:none;
    opacity:0; visibility:hidden; transition: opacity .3s ease;
  }
  .toast.show{ opacity:1; visibility:visible; }
  .toast span{
    display:inline-block; max-width:88vw;
    background: var(--navy); color:#fff;
    padding: 14px 22px; border-radius:999px;
    font-size:14px; font-weight:800;
    box-shadow: 0 10px 30px rgba(6,15,36,0.35);
  }

  /* ---------- attendance checkboxes ---------- */
  .check-group{ margin: 4px 0 18px; text-align:left; }
  .check-item{
    display:flex; align-items:center;
    padding: 14px; margin-bottom: 10px;
    border: 1.5px solid #d7deee; border-radius: 12px;
    font-size:15px; font-weight:800; color: var(--navy);
    cursor:pointer; -webkit-tap-highlight-color: transparent;
  }
  .check-item:last-child{ margin-bottom:0; }
  .check-item input{
    width:22px; height:22px; margin:0 12px 0 0; flex-shrink:0;
    cursor:pointer; accent-color: var(--navy);
  }

  /* ---------- admin list ---------- */
  .admin-stats{
    max-width: 560px; margin: 0 auto 18px;
    display:flex;
  }
  .stat-chip{
    flex:1; min-width:0; text-align:center;
    background:#fff; border:1.5px solid #e6eaf4; border-radius:14px;
    padding: 12px 6px; margin-right: 8px;
    box-shadow: 0 6px 18px rgba(11,28,63,0.05);
  }
  .stat-chip:last-child{ margin-right:0; }
  .stat-chip .num{ display:block; font-size:22px; font-weight:900; color: var(--navy); }
  .stat-chip .label{ display:block; margin-top:2px; font-size:11.5px; font-weight:800; color:#5b6786; }
  .stat-chip.seminar .num{ color:#1a8a4d; }
  .stat-chip.party .num{ color:#c26a00; }

  .admin-toolbar{
    max-width: 560px; margin: 0 auto 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .admin-count{
    font-size:13px; font-weight:800; color: var(--navy-soft);
  }
  .add-toggle{
    background: var(--navy-soft); color:#fff; border:none;
    padding: 9px 16px; border-radius:999px; font-size:12.5px; font-weight:800;
    cursor:pointer;
  }
  .add-toggle:hover{ background: var(--navy-mid); }

  .attendee-list{
    max-width: 560px; margin: 0 auto; display:flex; flex-direction:column;
  }
  .attendee-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid #e6eaf4; border-radius:14px;
    padding: 14px 16px;
    box-shadow: 0 6px 18px rgba(11,28,63,0.05);
    animation: popIn .3s ease;
  }
  .attendee-row + .attendee-row{ margin-top:10px; }
  .attendee-info{ flex:1; min-width:0; padding-right:10px; }
  .attendee-head{ display:flex; flex-wrap:wrap; align-items:center; }
  .attendee-info .name{ font-size:15px; font-weight:800; color: var(--navy); margin-right:8px; margin-bottom:4px; }
  .attendee-info .tags{ display:flex; margin-bottom:4px; }
  .tag{
    font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px;
    margin-right:6px; white-space:nowrap;
  }
  .tag.on{ background:#e6f6ec; color:#1a8a4d; }
  .tag.off{ background:#f1f3f8; color:#b0b8cc; }
  .attendee-info .time{ display:block; font-size:11px; color:#9aa4bd; }
  .del-btn{
    background:#fdecee; color:#e63946; border:none;
    width:34px; height:34px; border-radius:50%;
    font-size:16px; font-weight:900; cursor:pointer;
    flex-shrink:0;
    transition: background .2s ease;
  }
  .del-btn:hover{ background:#f9c9ce; }
  .attendee-list.busy{ opacity:.6; }
  .attendee-list.busy .del-btn{ pointer-events:none; }
  .confirm-text{ margin: -4px 0 18px; font-size:14px; line-height:1.6; color:#5b6786; font-weight:700; }
  .pw-confirm.danger{ background:#e63946; }
  .pw-confirm.danger:hover{ background:#c92f3b; }
  .empty-note{
    max-width:560px; margin: 30px auto; text-align:center;
    color:#9aa4bd; font-size:13px; font-weight:600;
  }

  /* ---------- google sheet refresh ---------- */
  .gsheet-block{
    max-width:560px; margin: 34px auto 0;
    padding-top: 24px;
    border-top: 1px dashed #dfe4ef;
    text-align:center;
  }
  .gsheet-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding: 14px;
    background:#1a73e8; color:#fff;
    border:none; border-radius: 999px;
    font-size:14.5px; font-weight:800;
    cursor:pointer;
    transition: background .2s ease, transform .2s ease;
  }
  .gsheet-btn:hover{ background:#1558b0; transform: translateY(-2px); }
  .gsheet-btn:disabled{ opacity:.6; cursor:default; transform:none; }
  .gsheet-status{
    margin-top:12px; font-size:12.5px; font-weight:700; min-height:16px;
  }
  .gsheet-status.ok{ color:#1a8a4d; }
  .gsheet-status.err{ color:#e63946; }

  /* ---------- password overlay ---------- */
  .pw-overlay{
    position: fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; z-index: 20;
    background: rgba(6,15,36,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .2s ease;
  }
  .pw-overlay.active{ opacity:1; visibility:visible; pointer-events:auto; }
  .pw-card{
    width:88vw; max-width:320px;
    background:#fff; border-radius:20px; padding: 28px 24px;
    text-align:center;
    box-shadow: 0 24px 60px rgba(6,15,36,0.4);
    animation: popIn .3s ease;
  }
  .pw-card h3{ font-size:17px; font-weight:900; color: var(--navy); margin-bottom:16px; }
  .pw-card input{
    width:100%; padding: 12px 14px;
    border: 1.5px solid #d7deee; border-radius: 12px;
    font-size:16px; text-align:center;
    outline:none; margin-bottom:12px;
    font-family: inherit;
  }
  .pw-actions{ display:flex; }
  .pw-actions button + button{ margin-left:8px; }
  .pw-actions button{
    flex:1; padding: 11px; border:none; border-radius:999px;
    font-size:13px; font-weight:800; cursor:pointer;
  }
  .pw-cancel{ background: var(--off-white); color: var(--navy); }
  .pw-confirm{ background: var(--navy); color:#fff; }
  .pw-confirm:hover{ background: var(--navy-mid); }
  .pw-cancel:hover{ background:#dfe4ef; }

  /* ---------- seminar group result ---------- */
  #groupOverlay{ z-index: 25; }
  .group-card{
    position:relative;
    width:88vw; max-width:340px;
    padding: 40px 28px 32px;
  }
  .group-close{
    position:absolute; top:14px; right:14px;
    width:34px; height:34px; border-radius:50%;
    background:#f1f3f8; color: var(--navy);
    border:none; font-size:18px; font-weight:900; line-height:1;
    cursor:pointer;
  }
  .group-close:hover{ background:#e2e6f0; }
  .group-badge{
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:1.5px;
    color: var(--navy); background: var(--off-white);
    padding: 5px 12px; border-radius:999px; margin-bottom:16px;
  }
  .group-name{ font-size:16px; font-weight:800; color:#5b6786; margin-bottom:6px; }
  .group-number{ font-size:52px; font-weight:900; color: var(--navy); line-height:1.2; }
  .group-sub{ margin-top:10px; font-size:13px; color:#9aa4bd; font-weight:600; }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<!-- ===================== HOME SCREEN ===================== -->
<section id="screen-home" class="screen active">
  <div class="home-inner">
    <div class="home-header">
      <img src="logo-cropped.png" alt="Pinskin Logo">
      <h1>핀스킨 행사 참여</h1>
    </div>
    <div class="home-tagline">아래 버튼을 눌러 참석 등록을 진행해주세요</div>

    <div class="banner-grid">
      <div class="banner" onclick="goTo('register')">
        <div class="banner-badge">JOIN</div>
        <h2>참여 등록하기</h2>
        <p>이름과 학과를 입력하고 행사 참석자 명단에 등록해요.</p>
      </div>

      <div class="banner admin" onclick="openPasswordGate()">
        <div class="banner-badge">ADMIN</div>
        <h2>참석자 관리</h2>
        <p>비밀번호 확인 후 참석자 명단을 확인하고 관리할 수 있어요.</p>
      </div>
    </div>
  </div>
</section>

<!-- ===================== REGISTER SCREEN ===================== -->
<section id="screen-register" class="screen detail-screen">
  <div class="detail-inner">
    <div class="detail-topbar">
      <button class="back-btn" onclick="goTo('home')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 18l-6-6 6-6"/></svg>
        홈으로
      </button>
      <img src="logo-cropped.png" class="mini-logo" alt="logo">
    </div>
    <div class="detail-hero">
      <h2>참여 등록</h2>
      <p>이름과 학과를 입력하고 참석할 행사를 선택해주세요</p>
    </div>
    <div class="form-card">
      <form id="registerForm" onsubmit="return submitRegister(event)">
        <div class="form-group">
          <label for="regName">이름</label>
          <input type="text" id="regName" placeholder="예) 홍길동" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="regDept">학과</label>
          <input type="text" id="regDept" placeholder="예) 기계공학과" autocomplete="off" required>
        </div>
        <div class="check-group">
          <label class="check-item"><input type="checkbox" id="regSeminar"><span>세미나 참석</span></label>
          <label class="check-item"><input type="checkbox" id="regParty"><span>뒷풀이 참석</span></label>
        </div>
        <button type="submit" class="submit-btn" id="regSubmit">완료</button>
        <div id="registerMsg" class="form-msg"></div>
      </form>
    </div>
  </div>
</section>

<!-- ===================== ADMIN SCREEN ===================== -->
<section id="screen-admin" class="screen detail-screen">
  <div class="detail-inner">
    <div class="detail-topbar">
      <button class="back-btn" onclick="goTo('home')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 18l-6-6 6-6"/></svg>
        홈으로
      </button>
      <img src="logo-cropped.png" class="mini-logo" alt="logo">
    </div>
    <div class="detail-hero">
      <h2>참석자 관리</h2>
      <p>등록된 참석자를 확인하고 추가/삭제할 수 있어요</p>
    </div>

    <div class="admin-stats">
      <div class="stat-chip"><span class="num" id="adminCount">0명</span><span class="label">전체 등록</span></div>
      <div class="stat-chip seminar"><span class="num" id="adminSeminar">0명</span><span class="label">세미나 참석</span></div>
      <div class="stat-chip party"><span class="num" id="adminParty">0명</span><span class="label">뒷풀이 참석</span></div>
    </div>

    <div class="admin-toolbar">
      <span class="admin-count">참석자 명단</span>
      <button class="add-toggle" onclick="toggleAddForm()">+ 직접 추가</button>
    </div>

    <div class="form-card" id="addForm" style="display:none; margin-bottom:22px;">
      <div class="form-group">
        <label for="addName">이름</label>
        <input type="text" id="addName" placeholder="예) 홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="addDept">학과</label>
        <input type="text" id="addDept" placeholder="예) 기계공학과" autocomplete="off">
      </div>
      <div class="check-group">
        <label class="check-item"><input type="checkbox" id="addSeminar"><span>세미나 참석</span></label>
        <label class="check-item"><input type="checkbox" id="addParty"><span>뒷풀이 참석</span></label>
      </div>
      <button type="button" class="submit-btn" onclick="adminAdd()">추가</button>
    </div>

    <div class="attendee-list" id="attendeeList"></div>
    <div class="empty-note" id="emptyNote" style="display:none;">아직 등록된 참석자가 없어요.</div>

    <div class="gsheet-block">
      <button class="gsheet-btn" id="gsheetBtn" onclick="syncToSheet()">🔄 구글 시트 최신화</button>
      <div id="gsheetStatus" class="gsheet-status"></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"><span></span></div>

<!-- ===================== SEMINAR GROUP RESULT ===================== -->
<div class="pw-overlay" id="groupOverlay">
  <div class="pw-card group-card">
    <button class="group-close" onclick="closeGroupOverlay()" aria-label="닫기">×</button>
    <div class="group-badge">세미나 조 배정</div>
    <div class="group-name" id="groupPersonName"></div>
    <div class="group-number" id="groupNumber"></div>
    <p class="group-sub">배정된 조로 이동해주세요</p>
  </div>
</div>

<!-- ===================== DELETE CONFIRM OVERLAY ===================== -->
<div class="pw-overlay" id="confirmOverlay">
  <div class="pw-card">
    <h3>삭제 확인</h3>
    <p class="confirm-text" id="confirmText"></p>
    <div class="pw-actions">
      <button class="pw-cancel" onclick="closeConfirm()">취소</button>
      <button class="pw-confirm danger" id="confirmOk">삭제</button>
    </div>
  </div>
</div>

<!-- ===================== ADMIN PASSWORD OVERLAY ===================== -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-card">
    <h3>비밀번호를 입력해주세요</h3>
    <input type="password" id="pwInput" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkPassword()">
    <div id="pwError" class="form-msg err" style="margin-top:-6px; margin-bottom:8px;"></div>
    <div class="pw-actions">
      <button class="pw-cancel" onclick="closePasswordGate()">취소</button>
      <button class="pw-confirm" id="pwConfirmBtn" onclick="checkPassword()">확인</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyXOI1MDwtvPijDZofhxZZvo2V3dIHnKT57o4StmZ3GzeYmh03X_wBmJG6A9Qg1liWFvQ/exec';

  function formatTime(t){
    const d = new Date(t);
    return isNaN(d) ? String(t || '') : d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
  }

  let adminPassword = null;

  function goTo(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    if(name === 'register'){
      document.getElementById('registerForm').reset();
      document.getElementById('registerMsg').textContent = '';
    }
  }

  const SEMINAR_GROUP_LISTS = {
    1: ['이건주','강경민','최유진','심혜연','김가현','윤혜원','장준서','정진','김솔미','신은재','박세인'],
    2: ['김지유','권준영','노현지','김효은','김민정','이솔비','박동현','김현상','전혜성','하가영','허규연'],
    3: ['옥서윤','김태형','서여원','박한별','이영채','이효정','박재영','박범근','이도현','심연주','문은비'],
    4: ['심우연','유시후','장보빈','심유빈','김희수','김서영','배준혁','이서현','이재혁','배은빈','김채윤'],
    5: ['최해원','서현우','정예진','홍수빈','서민정','정동윤','피찬진','김효주','정지윤','김한이','구민아'],
    6: ['김현지','이재연','조유빈','오민영','곽라율','팽재완','김덕승','박제영','최소려','전초현'],
    7: ['강예은','하세진','황지영','주소현','최자은','한태영','홍명완','이부강','박수빈','김수빈'],
    8: ['이유나','강경필','김민주','이가헌','전아현','남혜린','이승윤','이민재','이아진','김민지'],
    9: ['김수호','박지환','조민주','최아영','허성미','황정은','서성호','이승태','최지은','오지수','차정윤'],
  };
  const SEMINAR_GROUPS = {};
  Object.keys(SEMINAR_GROUP_LISTS).forEach(g => {
    SEMINAR_GROUP_LISTS[g].forEach(n => { SEMINAR_GROUPS[n] = Number(g); });
  });

  function showGroupOverlay(name, group){
    document.getElementById('groupPersonName').textContent = name + '님은';
    document.getElementById('groupNumber').textContent = group + '조';
    document.getElementById('groupOverlay').classList.add('active');
  }
  function closeGroupOverlay(){
    document.getElementById('groupOverlay').classList.remove('active');
  }

  let toastTimer = null;
  function showToast(text){
    const t = document.getElementById('toast');
    t.querySelector('span').textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  /* ---------- backend call helper ---------- */
  function apiCall(action, payload){
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload))
    }).then(res => res.json());
  }

  /* ---------- register ---------- */
  function submitRegister(e){
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const msg = document.getElementById('registerMsg');
    if(!name || !dept){
      msg.textContent = '이름과 학과를 모두 입력해주세요.';
      msg.className = 'form-msg err';
      return false;
    }
    const seminar = document.getElementById('regSeminar').checked;
    const party = document.getElementById('regParty').checked;
    const btn = document.getElementById('regSubmit');
    if(btn.disabled) return false;
    btn.disabled = true;
    btn.textContent = '등록 중...';
    msg.textContent = '';
    msg.className = 'form-msg';
    apiCall('register', { name, dept, seminar, party })
      .then(res => {
        if(res.status === 'ok'){
          document.getElementById('registerForm').reset();
          goTo('home');
          const group = seminar ? SEMINAR_GROUPS[name] : undefined;
          if(group){
            showGroupOverlay(name, group);
          }else{
            showToast('등록이 완료되었습니다!');
          }
        }else{
          msg.textContent = res.message || '등록에 실패했습니다.';
          msg.className = 'form-msg err';
        }
      })
      .catch(() => {
        msg.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
        msg.className = 'form-msg err';
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '완료';
      });
    return false;
  }

  /* ---------- admin password gate ---------- */
  function openPasswordGate(){
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').textContent = '';
    document.getElementById('pwOverlay').classList.add('active');
    setTimeout(() => document.getElementById('pwInput').focus(), 50);
  }
  function closePasswordGate(){
    document.getElementById('pwOverlay').classList.remove('active');
  }
  function checkPassword(){
    const val = document.getElementById('pwInput').value;
    const btn = document.getElementById('pwConfirmBtn');
    const err = document.getElementById('pwError');
    btn.disabled = true;
    err.textContent = '';
    apiCall('list', { password: val })
      .then(res => {
        if(res.status === 'ok'){
          adminPassword = val;
          closePasswordGate();
          renderAdminList(res.attendees);
          goTo('admin');
        }else{
          err.textContent = res.message || '비밀번호가 올바르지 않습니다.';
        }
      })
      .catch(() => {
        err.textContent = '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
      })
      .finally(() => {
        btn.disabled = false;
      });
  }

  /* ---------- admin panel ---------- */
  function toggleAddForm(){
    const f = document.getElementById('addForm');
    f.style.display = (f.style.display === 'none') ? 'block' : 'none';
  }
  function adminAdd(){
    const nameEl = document.getElementById('addName');
    const deptEl = document.getElementById('addDept');
    const name = nameEl.value.trim();
    const dept = deptEl.value.trim();
    if(!name || !dept){
      alert('이름과 학과를 모두 입력해주세요.');
      return;
    }
    const seminar = document.getElementById('addSeminar').checked;
    const party = document.getElementById('addParty').checked;
    apiCall('add', { name, dept, seminar, party, password: adminPassword })
      .then(res => {
        if(res.status === 'ok'){
          nameEl.value = '';
          deptEl.value = '';
          document.getElementById('addSeminar').checked = false;
          document.getElementById('addParty').checked = false;
          document.getElementById('addForm').style.display = 'none';
          refreshAdminList();
        }else{
          alert(res.message || '추가에 실패했습니다.');
        }
      })
      .catch(() => alert('서버 연결에 실패했습니다.'));
  }
  let currentList = [];
  let deleting = false;
  function closeConfirm(){
    document.getElementById('confirmOverlay').classList.remove('active');
  }
  function adminDelete(id){
    if(deleting) return;
    const a = currentList.find(x => String(x.id) === String(id));
    if(!a) return;
    document.getElementById('confirmText').textContent = `${a.dept} ${a.name}님을 명단에서 삭제할까요?`;
    document.getElementById('confirmOk').onclick = () => { closeConfirm(); runDelete(a.id); };
    document.getElementById('confirmOverlay').classList.add('active');
  }
  function runDelete(id){
    if(deleting) return;
    deleting = true;
    const list = document.getElementById('attendeeList');
    const status = document.getElementById('gsheetStatus');
    list.classList.add('busy');
    status.textContent = '삭제 중...';
    status.className = 'gsheet-status';
    const fail = (m) => { const e = new Error(m); e.custom = true; return e; };
    apiCall('delete', { id, password: adminPassword })
      .then(res => {
        if(res.status !== 'ok') throw fail(res.message || '삭제에 실패했습니다.');
        return apiCall('list', { password: adminPassword });
      })
      .then(res => {
        if(res.status !== 'ok') throw fail(res.message || '불러오기에 실패했습니다.');
        renderAdminList(res.attendees);
        status.textContent = '';
        showToast('삭제했습니다.');
      })
      .catch(err => {
        status.textContent = (err && err.custom) ? err.message : '서버 연결에 실패했습니다.';
        status.className = 'gsheet-status err';
      })
      .finally(() => {
        deleting = false;
        list.classList.remove('busy');
      });
  }
  function refreshAdminList(){
    const status = document.getElementById('gsheetStatus');
    status.textContent = '불러오는 중...';
    status.className = 'gsheet-status';
    apiCall('list', { password: adminPassword })
      .then(res => {
        if(res.status === 'ok'){
          renderAdminList(res.attendees);
          status.textContent = '최신 명단을 불러왔습니다.';
          status.className = 'gsheet-status ok';
        }else{
          status.textContent = res.message || '불러오기에 실패했습니다.';
          status.className = 'gsheet-status err';
        }
      })
      .catch(() => {
        status.textContent = '서버 연결에 실패했습니다.';
        status.className = 'gsheet-status err';
      });
  }
  function syncToSheet(){
    const btn = document.getElementById('gsheetBtn');
    const status = document.getElementById('gsheetStatus');
    btn.disabled = true;
    status.textContent = '구글 시트에 반영 중...';
    status.className = 'gsheet-status';
    apiCall('sync', { password: adminPassword })
      .then(res => {
        if(res.status === 'ok'){
          renderAdminList(res.attendees);
          status.textContent = `현재 참석자 ${res.attendees.length}명을 구글 시트(참석자현황)에 반영했습니다.`;
          status.className = 'gsheet-status ok';
        }else{
          status.textContent = res.message || '반영에 실패했습니다.';
          status.className = 'gsheet-status err';
        }
      })
      .catch(() => {
        status.textContent = '서버 연결에 실패했습니다.';
        status.className = 'gsheet-status err';
      })
      .finally(() => {
        btn.disabled = false;
      });
  }
  function renderAdminList(list){
    const attendees = list || [];
    currentList = attendees;
    const container = document.getElementById('attendeeList');
    const emptyNote = document.getElementById('emptyNote');
    const yes = (v) => v === true || v === 'O' || v === 'TRUE' || v === 'true';
    const seminarCount = attendees.filter(a => yes(a.seminar)).length;
    const partyCount = attendees.filter(a => yes(a.party)).length;
    document.getElementById('adminCount').textContent = `${attendees.length}명`;
    document.getElementById('adminSeminar').textContent = `${seminarCount}명`;
    document.getElementById('adminParty').textContent = `${partyCount}명`;

    if(attendees.length === 0){
      container.innerHTML = '';
      emptyNote.style.display = 'block';
      return;
    }
    emptyNote.style.display = 'none';
    const tag = (label, on) => `<span class="tag ${on ? 'on' : 'off'}">${label} ${on ? '✓' : '–'}</span>`;
    container.innerHTML = attendees.map((a) => `
      <div class="attendee-row">
        <div class="attendee-info">
          <div class="attendee-head">
            <span class="name">${escapeHtml(a.dept)} 이름:${escapeHtml(a.name)}</span>
            <span class="tags">${tag('세미나', yes(a.seminar))}${tag('뒷풀이', yes(a.party))}</span>
          </div>
          <span class="time">${escapeHtml(formatTime(a.time))}</span>
        </div>
        <button class="del-btn" onclick="adminDelete('${escapeHtml(a.id)}')" title="삭제">×</button>
      </div>
    `).join('');
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }
</script>

</body>
</html>
